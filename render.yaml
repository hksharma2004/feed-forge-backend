services:
  - type: web
    name: feedforge-api
    env: python
    plan: free
    buildCommand: npm install && pip install -r requirements.txt
    startCommand: PATH=$PWD/node_modules/.bin:$PATH uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_PATH
        value: /var/data/feedforge.db
      - key: CAMPAIGNS_DIR
        value: /var/data/campaigns
      - key: OPENROUTER_MODEL
        value: openrouter/owl-alpha
      - key: OPENROUTER_APP_NAME
        value: FeedForge
      - key: CORS_ORIGINS
        value: https://feedforge.harsh1.tech,http://localhost:3000,http://localhost:3001
      - key: OPENROUTER_SITE_URL
        value: https://feedforge.harsh1.tech
