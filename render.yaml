services:
  - type: web
    name: feedforge-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_PATH
        value: /var/data/feedforge.db
      - key: CAMPAIGNS_DIR
        value: /var/data/campaigns
      - key: OPENROUTER_MODEL
        value: openrouter/owl-alpha
      - key: OPENROUTER_APP_NAME
        value: FeedForge
